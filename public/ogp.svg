<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .t { font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif; font-weight: 800; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#FFF8F0" />

  <!-- ドット背景 -->
  <g fill="#FFD9E9">
    <circle cx="80" cy="80" r="10" /><circle cx="200" cy="140" r="10" />
    <circle cx="1100" cy="90" r="10" /><circle cx="1010" cy="200" r="10" />
    <circle cx="120" cy="520" r="10" /><circle cx="1130" cy="540" r="10" />
    <circle cx="960" cy="470" r="10" /><circle cx="260" cy="440" r="10" />
  </g>

  <!-- メインカード -->
  <rect x="90" y="120" width="1020" height="390" rx="36" fill="#FFFFFF" stroke="#1A1533" stroke-width="6" />
  <rect x="102" y="132" width="1020" height="390" rx="36" fill="none" stroke="#1A1533" stroke-width="6" opacity="0.15" />

  <text class="t" x="600" y="290" font-size="104" fill="#1A1533" text-anchor="middle">大阪めしMAP</text>
  <text class="t" x="600" y="360" font-size="36" fill="#6B6483" text-anchor="middle">ぼくのすきな大阪のごはん、地図とタグで。</text>

  <!-- タグチップ -->
  <g class="t" font-size="28" fill="#1A1533" text-anchor="middle">
    <rect x="360" y="405" width="150" height="56" rx="28" fill="#FFC400" stroke="#1A1533" stroke-width="4" />
    <text x="435" y="443">粉モン</text>
    <rect x="525" y="405" width="180" height="56" rx="28" fill="#FF2E88" stroke="#1A1533" stroke-width="4" />
    <text x="615" y="443" fill="#FFFFFF">大阪ぽい</text>
    <rect x="720" y="405" width="150" height="56" rx="28" fill="#00D9C0" stroke="#1A1533" stroke-width="4" />
    <text x="795" y="443">一人OK</text>
  </g>
</svg>
